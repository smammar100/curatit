# Project-scoped connections. Credentials stay in the shell, never in this file.
# These definitions do not install the Paddle skills plugin or complete OAuth.
[mcp_servers.paddle-docs]
url = "https://paddlehq.mcp.kapa.ai"

[mcp_servers.paddle-sandbox]
url = "https://sandbox-mcp.paddle.com/mcp"
bearer_token_env_var = "PADDLE_SANDBOX_API_KEY"

# Enable only for an explicitly requested live-account task.
[mcp_servers.paddle-live]
url = "https://mcp.paddle.com/mcp"
enabled = false

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # onnxruntime-node would otherwise download CUDA libraries on Linux x64 (also set in .npmrc)
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run typecheck
      - run: npm test
      - run: npm run mcp:bridge:build
      - run: npm run mcp:adapter:build
      # Hybrid search's models (prebuild fetches them, pinned and checksummed); cached by the pins
      - uses: actions/cache@v4
        with:
          path: models
          key: search-models-${{ hashFiles('scripts/fetch-search-models.mjs') }}
      # The site build needs the public Supabase keys to read the library at build time
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_DIST_DIR: .next-ci
